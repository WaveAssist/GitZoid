name: Gitzoid
description: AI-powered GitHub bot that monitors pull requests, generates structured reviews, and posts them back. Automatically detects new commits and provides incremental reviews.
success_message: Gitzoid is setup and running. It will auto review all your new pull requests and follow-up commits within a few minutes.
output_default_message: "Run completed, no new pull requests to review. \n<br> Gitzoid will automatically review all your new pull requests and incremental changes."

requirements:
  - openai

nodes:
  # Single DAG, single starting node (house pattern, like GitDigest/WaveContent). The cheap
  # credit+init gate runs FIRST — before the expensive brain build — then the brain, then the
  # review pipeline. So credits are checked once up front, the progress bar shows from second 0,
  # the review always sees a fresh per-repo profile (no brainless first review), and there is one
  # run in View Runs. study_repos self-throttles: it rebuilds the profile only every ~14 days and
  # is a cheap no-op (no GitHub/LLM calls) on the other 2-min cycles.
  - key: check_credits_and_init
    name: CheckCreditsAndInit
    file_name: check_credits_and_init.py
    starting_node: true
    chain_label: "PR Review"          # dashboard label for this chain's runs
    schedule:
      interval:
        every: 2
        period: minutes

  - key: study_repos
    name: StudyRepos
    file_name: study_repos.py
    run_after:
      - check_credits_and_init

  - key: fetch_pull_requests
    name: FetchPRs
    file_name: fetch_pull_requests.py
    run_after:
      - study_repos

  - key: generate_review
    name: GenerateReview
    file_name: generate_review.py
    run_after:
      - fetch_pull_requests

  - key: post_comment
    name: PostComment
    file_name: post_comment.py
    run_after:
      - generate_review

  # ---- Security Watch chain (Phase B) ----
  # A SEPARATE disconnected subgraph with its OWN daily clock, so the (slow, weekly) deep audit never
  # holds the 2-min review lock. One starting node per connected subgraph — the review chain above and
  # this security chain are independent, which the platform supports. deep_security_audit self-throttles
  # to weekly per repo; triage_and_alert is the single gate + alert path and releases security_run_lock.
  - key: security_check_and_init
    name: SecurityCheckAndInit
    file_name: security_check_and_init.py
    starting_node: true
    chain_label: "Security Watch"      # dashboard label for this chain's runs
    schedule:
      cron: "0 6 * * *"   # daily at 06:00 UTC
      timezone: "UTC"

  - key: scan_dependencies
    name: ScanDependencies
    file_name: scan_dependencies.py
    run_after:
      - security_check_and_init

  - key: deep_security_audit
    name: DeepSecurityAudit
    file_name: deep_security_audit.py
    run_after:
      - scan_dependencies

  - key: triage_and_alert
    name: TriageAndAlert
    file_name: triage_and_alert.py
    run_after:
      - deep_security_audit

  # ---- Knowledge Digest chain (Phase C) ----
  # A THIRD disconnected subgraph on its own WEEKLY clock (Mon 08:30 UTC, the GitDigest house default), so
  # the multi-repo activity analysis never holds the 2-min review lock or the daily security lock. One
  # starting node per connected subgraph — review, security, and digest are three independent chains, which
  # the platform supports. digest_check_and_init gates (credits + enable_digest + lock) and resolves the
  # per-group working set; send_digest releases digest_run_lock. The brain (profile:{repo}) is read ONLY if
  # present — never a hard dependency: a run_after linking these nodes to study_repos would merge the digest
  # and review subgraphs into one connected graph with two starting nodes and fail deploy validation.
  - key: digest_check_and_init
    name: DigestCheckAndInit
    file_name: digest_check_and_init.py
    starting_node: true
    chain_label: "Knowledge Digest"    # dashboard label for this chain's runs
    schedule:
      cron: "30 8 * * 1"   # weekly, Monday 08:30 UTC
      timezone: "UTC"

  - key: fetch_activity
    name: FetchActivity
    file_name: fetch_activity.py
    run_after:
      - digest_check_and_init

  - key: analyze_activity
    name: AnalyzeActivity
    file_name: analyze_activity.py
    run_after:
      - fetch_activity

  - key: generate_business_report
    name: GenerateBusinessReport
    file_name: generate_business_report.py
    run_after:
      - analyze_activity

  - key: generate_technical_report
    name: GenerateTechnicalReport
    file_name: generate_technical_report.py
    run_after:
      - generate_business_report

  - key: send_digest
    name: SendDigest
    file_name: send_digest.py
    run_after:
      - generate_technical_report

variables:
  - type: github
    name: github
    display_name: GitHub
    key: github
    is_optional: false
    scopes: ["repo"]
    required_resources: ["repos"]
    helper_message: "Connect your GitHub account to the app"
    display_type: "base"

  # Two model tiers — override via store_data, or leave unset to use the defaults below:
  #   model_name  — primary model for reviews, reports, security audit (default: anthropic/claude-sonnet-4.6)
  #   lite_model  — cheaper model for study_repos and analyze_activity (default: anthropic/claude-haiku-4.5)

  # Security Watch toggle. Default ON (existing + new users). Turning it off skips the whole security
  # chain cleanly (no failed runs). The daily scan is silent unless it finds something real.
  - name: enable_security
    key: enable_security
    display_name: Security Watch
    type: select
    is_optional: true
    default_value: "true"
    helper_message: "Daily dependency & supply-chain watch plus a weekly deep code audit. Silent unless it finds a real, exploitable issue."
    options:
      - name: "On"
        key: "true"
      - name: "Off"
        key: "false"

  # Which weekday the DEEP code audit runs. The dependency scan runs daily regardless; the audit is
  # weekly (plus once on first setup so you see it immediately). Mon=0 .. Sun=6.
  - name: audit_day
    key: audit_day
    display_name: Weekly security audit day
    type: select
    is_optional: true
    default_value: "0"
    helper_message: "Day of the week GitZoid runs the deep security code audit. The daily dependency scan is unaffected."
    options:
      - name: Monday
        key: "0"
      - name: Tuesday
        key: "1"
      - name: Wednesday
        key: "2"
      - name: Thursday
        key: "3"
      - name: Friday
        key: "4"
      - name: Saturday
        key: "5"
      - name: Sunday
        key: "6"

  # Project groups for SECURITY alerts. Each group is {name, repos[], recipients[]} and routes that
  # group's alerts to its OWN recipients only (owner always primary). Repo membership is exclusive: a
  # repo belongs to the first group that lists it, so a finding's alert reaches exactly one group's
  # recipients (no cross-group CC leak). Mirrors digest_groups but is a SEPARATE list, because the
  # security audience (engineers / security leads) usually differs from the digest audience (leadership).
  # Grouping is delivery-only: scanning and the dedup ledger stay global (reconcile once, split at send),
  # so the code-finding cap becomes per group. Empty/unset -> ONE implicit group over all selected repos
  # (owner only), so alerts ship with zero dashboard setup. A repo left out of every group still alerts
  # the OWNER (never silently dropped). Stored as a JSON string (data_type "list").
  - name: security_groups
    key: security_groups
    display_name: "Security alert groups"
    type: repo_groups
    is_optional: true
    depends_on: github
    default_value: "[]"
    helper_message: "Send security alerts for different repos to different people. Each group emails its own recipients. Leave empty to alert the owner about all repos."

  # Knowledge Digest toggle. Config default is "true" so a NEW user's setup wizard stores "true" and the
  # digest is ON for them. EXISTING users never stored this key, so the node treats unset as OFF (no surprise
  # weekly emails) — the OPPOSITE of enable_security, because the digest is a recurring email, not a silent
  # watch. Existing users turn it on in one click. See digest_check_and_init.digest_enabled().
  - name: enable_digest
    key: enable_digest
    display_name: Knowledge Digest
    type: select
    is_optional: true
    default_value: "true"
    helper_message: "Weekly leadership-ready digest of what actually shipped, read from your code diffs and grouped by project, with a security roll-up. One email a week, even in a quiet week."
    options:
      - name: "On"
        key: "true"
      - name: "Off"
        key: "false"

  # Project groups for the digest. Each group is {name, repos[], recipients[]} and gets its own weekly email
  # (owner always primary, recipients CC'd). Repos belong to at most one group (exclusive membership, enforced
  # in the dashboard input). Empty/unset → the node falls back to ONE implicit group over all selected repos,
  # so the digest ships with zero dashboard dependency. Stored as a JSON string (data_type "list").
  - name: digest_groups
    key: digest_groups
    display_name: "Knowledge Digest"
    type: repo_groups
    is_optional: true
    depends_on: github
    default_value: "[]"
    helper_message: "Send a separate weekly digest per group, each to its own recipients. Leave empty for one digest of all repos."

  - name: schedule
    key: schedule
    display_name: Review frequency
    value:
      cron: "*/2 * * * *"
      timezone: "UTC"
    type: "schedule"
    is_optional: true
    helper_message: "How often GitZoid should check and review your pull requests"
    options:
      - name: Quick (every 2 minutes)
        key:
          cron: "*/2 * * * *"
          timezone: "UTC"
      - name: Relaxed (every 5 minutes)
        key:
          cron: "*/5 * * * *"
          timezone: "UTC"
      - name: Webhook only (trigger based, with 30 mins fallback)
        key:
          cron: "*/30 * * * *"
          timezone: "UTC"
